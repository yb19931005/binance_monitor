version: "3.8"

services:
  monitor:
    build: .
    container_name: aoying_monitor
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    # 如果需要代理，可在 .env 中配置 PROXY

  redis:
    image: redis:7-alpine
    container_name: aoying_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: aoying_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor_pass
      POSTGRES_DB: binance_monitor
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d binance_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  pg_data:
